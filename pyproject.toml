[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphagentdb"
version = "0.2.0"
description = "Hybrid graph + vector knowledge base for AI agents, built on Kùzu, LanceDB, LangGraph and Gemini."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Filipe Carmo" }]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "google-genai>=1.0",
    "kuzu>=0.11,<0.12",
    "lancedb>=0.20",
    "langgraph>=0.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "rich>=13",
    "typer>=0.12",
    "uvicorn>=0.28",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[project.scripts]
graphagentdb = "graphagentdb.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is idiomatic
    "E501",  # line length is handled by `ruff format`; long prompt strings are left intact
]

[tool.pytest.ini_options]
testpaths = ["tests"]
